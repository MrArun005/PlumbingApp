# Production stack for a single VPS. Full runbook: docs/DEPLOY.md
#
#   cp .env.production.example .env   # then fill it in
#   # write ./Caddyfile first — see docs/DEPLOY.md "TLS with Caddy"
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports. Postgres and Redis sit on an `internal` network
# with no host port mapping and no route off the box, so nothing but the API
# can reach them. Do not add a `ports:` key to them "just to check something" —
# use `docker compose exec` instead.
name: pipefix

# A 2 vCPU / 4 GB VPS has a small disk. Cap log growth everywhere.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ─── edge: TLS termination + HTTP/3, automatic Let's Encrypt ──────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # Must exist as a FILE before the first `up`, or Docker helpfully
      # creates a directory here and Caddy fails to start.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ACME account keys + issued certificates. Losing this volume means
      # re-issuing certs, which can hit Let's Encrypt rate limits. Back it up.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - edge

  # ─── the API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: pipefix-api:latest
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    # No `ports:` — Caddy proxies to it over the `edge` network.
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - internal

  # ─── one-shot schema migration, runs to completion before the API boots ───
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: pipefix-migrate:latest
    restart: 'no'
    logging: *default-logging
    env_file: .env
    command: ['pnpm', '--filter', '@pipefix/db', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  # ─── data ────────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pipefix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # appendonly: OTP codes and refresh-token families live here. Losing them
    # logs everyone out and invalidates in-flight OTPs — survivable, but a
    # restart should not do it.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

networks:
  edge:
  internal:
    # No route to or from the internet. Postgres and Redis do not need egress.
    internal: true

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
